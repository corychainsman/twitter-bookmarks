<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moved to bookmarks.corychainsman.com</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://bookmarks.corychainsman.com/" />
    <script>
      // GitHub Pages cannot issue a real 3xx, so forward client-side.
      // This file is also published as 404.html, which Pages serves for every
      // path that does not exist -- and since the artifact contains only these
      // two files, that is every path on the legacy host.
      (function () {
        var target = 'https://bookmarks.corychainsman.com';
        var base = '/twitter-bookmarks';
        var path = window.location.pathname || '/';

        // Strip the project-pages base prefix ("/twitter-bookmarks[/...]").
        if (path === base) {
          path = '/';
        } else if (path.indexOf(base + '/') === 0) {
          path = path.slice(base.length);
        }

        // Directory-style index files have no meaning on the new host.
        path = path.replace(/\/index\.html$/, '/');
        if (path.charAt(0) !== '/') path = '/' + path;

        window.location.replace(target + path + window.location.search + window.location.hash);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://bookmarks.corychainsman.com/" />
    </noscript>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0c;
        color: #e7e7ea;
        text-align: center;
        padding: 1rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <p>
      This site moved to
      <a href="https://bookmarks.corychainsman.com/">bookmarks.corychainsman.com</a>.
    </p>
  </body>
</html>
